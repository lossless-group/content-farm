name: Deploy splash to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: splash
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Fetch submodules so context-v/ aggregations from plugin-modules
          # are available at build time. Submodules also expose their own
          # changelogs/specs if we choose to surface them later.
          submodules: recursive
          fetch-depth: 1

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: splash/pnpm-lock.yaml

      - name: Install
        run: pnpm install --frozen-lockfile=false

      - name: Build
        run: pnpm build
        env:
          # Auth for the rollup loader's GitHub Content API calls.
          # Raises the rate limit from 60 req/hr (anonymous) to 5000 req/hr.
          # The default GITHUB_TOKEN is enough — public repo content is
          # readable regardless of the token's repo scope; we just need an
          # authenticated identity for the rate limit bucket.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          # Auto-enable Pages on first run so the workflow bootstraps itself
          # even when "Get Pages site" returns 404 the very first time.
          enablement: true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: splash/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
