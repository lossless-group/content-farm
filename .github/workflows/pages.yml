name: Redirect GitHub Pages to the splash

# The splash renders per request now, which Pages can't do, so Vercel serves it.
# Pages publishes only a redirect, so old links land on the same page at the new
# address.
#
# Set the repo variable SPLASH_URL (no trailing slash) to the new address. Without
# it this fails on purpose, and Pages keeps serving what it already has.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Build redirect
        env:
          SPLASH_URL: ${{ vars.SPLASH_URL }}
        run: |
          if [ -z "$SPLASH_URL" ]; then
            echo "::error::Set the SPLASH_URL repo variable before Pages can redirect."
            exit 1
          fi
          mkdir -p _site
          sed "s|__SPLASH_URL__|$SPLASH_URL|g" splash/pages-redirect/index.html > _site/index.html
          cp _site/index.html _site/404.html

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
